<div class="calendar-container">
  <table>
    <thead>
      <tr>
        <th *ngFor="let day of daysInWeek">{{ day }}</th>
      </tr>
    </thead>

    <tbody>
      
        <td *ngFor="let day of daysToDisplay">
          {{ day.geoDate }}
          <!-- <input type="text"> -->
        </td>
     
    </tbody>
  </table>

  <!-- <button (click)="fetchApiTimes">fetch api times</button> -->
</div>
